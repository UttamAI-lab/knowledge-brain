[project]
name = "knowledge-brain"
version = "0.1.0"
description = "Employee Knowledge Brain — RAG Chatbot"
requires-python = ">=3.11"

dependencies = [
    # ─── Web Framework ───────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # ─── RAG & LLM ───────────────────────────────────
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    # ─── Vector Database ─────────────────────────────
    "chromadb>=0.5.0",
    # ─── Embeddings ──────────────────────────────────
    "sentence-transformers>=3.0.0",
    # ─── Document Loaders ────────────────────────────
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # ─── Config & Env ────────────────────────────────
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-chroma>=1.1.0",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "rank-bm25>=0.2.2",
    "langchain-experimental>=0.4.1",
    "psycopg2-binary>=2.9.12",
    "bcrypt>=5.0.0",
    "langfuse>=4.6.1",
    "ragas>=0.4.3",
    "datasets>=4.8.5",
]

[project.optional-dependencies]
production = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
]

enterprise = [
    "ragas>=0.1.0",
    "langfuse>=2.0.0",
    "langgraph>=0.1.0",
    "rank-bm25>=0.2.2",
    "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
